name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: clojure:temurin-8-lein
    steps:
      - uses: actions/checkout@v4
      - run: lein deps && lein cljsbuild once prod && lein cljsbuild once server-prod
